name: V3 evidence brain validation

on:
  push:
    branches: [main, v3-evidence-brain, v4-production-edge, v4-press-odds-benchmark, press-odds-benchmark-engine, press-odds-cleanup-v2, v5-market-opportunity-layer, feat/trainer-driver-history-features]
  workflow_dispatch:

# Generated model-artifact commits must not start another validation cycle.
# Otherwise the bot commit at the end of this workflow can retrigger itself indefinitely.

concurrency:
  group: v3-evidence-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      # Source-only checkout: the generated training dataset is rebuilt by this workflow.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            data/model
            data/matched
            data/processed/programs
            data/structured/programs
            requirements.txt
            scripts
            src
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Snapshot champion walk-forward metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("data/model/v3_backtest_report.json").read_text(encoding="utf-8"))
          metrics=report.get("metrics", report)
          Path("/tmp/v3_champion_metrics.json").write_text(json.dumps(metrics), encoding="utf-8")
          print("Snapshotted champion metrics:", {k: metrics.get(k) for k in (
              "winner_hit_rate_at_3",
              "average_actual_top3_covered_by_predicted_top3",
              "average_actual_top3_covered_by_predicted_top5",
              "brier_top3",
              "log_loss_top3",
          )})
          PY
      - name: Rebuild structured pre-race LONAB programs
        run: python -m src.parsers.program_parser
      - name: Build verified historical dataset
        run: python scripts/build_historical_dataset.py
      - name: Run V3 tests
        run: python -m pytest -q
      - name: Run V3 walk-forward backtest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/dataset/training_dataset_clean.json").read_text())
          print(f"Dataset rows={len(d)} races={len({r.get('race_key') for r in d})}")
          PY
          python -m src.model.v3_backtest
      - name: Enforce challenger improvement over champion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path("/tmp/v3_champion_metrics.json").read_text(encoding="utf-8"))
          candidate_report=json.loads(Path("data/model/v3_backtest_report.json").read_text(encoding="utf-8"))
          candidate=candidate_report.get("metrics", candidate_report)
          keys=(
              "winner_hit_rate_at_3",
              "average_actual_top3_covered_by_predicted_top3",
              "average_actual_top3_covered_by_predicted_top5",
              "brier_top3",
              "log_loss_top3",
          )
          def val(d,k):
              return float(d[k])
          delta={k: round(val(candidate,k)-val(baseline,k),6) for k in keys}
          no_material_regression=(
              val(candidate,"winner_hit_rate_at_3") >= val(baseline,"winner_hit_rate_at_3") - 0.005
              and val(candidate,"average_actual_top3_covered_by_predicted_top3") >= val(baseline,"average_actual_top3_covered_by_predicted_top3") - 0.01
              and val(candidate,"average_actual_top3_covered_by_predicted_top5") >= val(baseline,"average_actual_top3_covered_by_predicted_top5") - 0.01
              and val(candidate,"brier_top3") <= val(baseline,"brier_top3") + 0.005
              and val(candidate,"log_loss_top3") <= val(baseline,"log_loss_top3") + 0.015
          )
          material_gain=(
              delta["winner_hit_rate_at_3"] >= 0.01
              or delta["average_actual_top3_covered_by_predicted_top3"] >= 0.02
              or delta["average_actual_top3_covered_by_predicted_top5"] >= 0.02
              or delta["brier_top3"] <= -0.003
              or delta["log_loss_top3"] <= -0.01
          )
          print(json.dumps({"champion":{k:baseline[k] for k in keys},
                            "challenger":{k:candidate[k] for k in keys},
                            "delta":delta,
                            "no_material_regression":no_material_regression,
                            "material_gain":material_gain},indent=2))
          if not no_material_regression:
              raise SystemExit("Challenger rejected: material regression against champion.")
          if not material_gain:
              raise SystemExit("Challenger rejected: no material walk-forward improvement over champion.")
          PY
      - name: Train V3 model bundle
        run: python -m src.model.v3_train
      - name: Run historical press-odds benchmark
        run: python -m src.model.press_odds_benchmark
      - name: Verify economic safety gate
        run: |
          python -m src.model.autopilot_guard
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/model/economic_validation_report.json').read_text())
          if p.get('status') == 'available' and float(p.get('roi', 0)) <= 0:
              raise SystemExit('Economic validation FAILED: non-positive ROI')
          print('Economic safety gate passed; live stakes remain blocked when price evidence is insufficient.')
          PY
      - name: Verify V3 promotion gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/model/v3_models.json').read_text())
          if payload.get('production_approved') is not True:
              raise SystemExit('V3 promotion gate FAILED: challenger is not approved for production')
          print('V3 promotion gate PASSED')
          PY
      - name: Commit V3 model artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model/v3_models.json data/model/v3_backtest_report.json data/model/press_odds_benchmark_report.json
          if git diff --cached --quiet; then
            echo "No model artifact changes to commit"
            exit 0
          fi
          git commit -m "Update V3 evidence model artifact [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
