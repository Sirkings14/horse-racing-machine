name: V3 evidence brain validation

on:
  push:
    branches: [main, v3-evidence-brain, v4-production-edge, v4-press-odds-benchmark, press-odds-benchmark-engine, press-odds-cleanup-v2, v5-market-opportunity-layer, fix/telegram-idempotency-result-truth-audit, fix/result-truth-telegram-safety]
  workflow_dispatch:

# Generated model-artifact commits must not start another validation cycle.
# Otherwise the bot commit at the end of this workflow can retrigger itself indefinitely.

concurrency:
  group: v3-evidence-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      # Source-only checkout: the generated training dataset is rebuilt by this workflow.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            data/model
            data/matched
            data/processed/programs
            data/structured/programs
            data/structured/results
            data/predictions
            data/evaluation
            data/live
            data/rosters
            requirements.txt
            scripts
            src
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Build verified historical dataset
        run: python scripts/build_historical_dataset.py
      - name: Run V3 tests
        run: python -m pytest -q
      - name: Audit result truth using validated historical rosters
        run: |
          python -m src.learning.evaluate_predictions
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("data/evaluation/result_truth_audit.json").read_text(encoding="utf-8"))
          print(json.dumps({key: report.get(key) for key in (
              "result_races_seen", "accepted", "rejected",
              "validated_result_documents", "duplicate_result_documents",
              "conflicting_result_races", "conflicting_result_documents",
              "program_roster_conflicts", "stored_evaluations_quarantined",
              "stored_verified_evaluations_after_quarantine", "v4_verified_races",
              "rejection_reasons",
          )}, indent=2, ensure_ascii=False))
          PY
      - name: Run V3 walk-forward backtest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/dataset/training_dataset_clean.json").read_text())
          print(f"Dataset rows={len(d)} races={len({r.get('race_key') for r in d})}")
          PY
          python -m src.model.v3_backtest
      - name: Run historical press-odds benchmark
        run: python -m src.model.press_odds_benchmark
      - name: Train V3 model bundle
        run: python -m src.model.v3_train
      - name: Verify economic safety gate
        run: |
          python -m src.model.autopilot_guard
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/model/economic_validation_report.json').read_text())
          if p.get('status') == 'available' and float(p.get('roi', 0)) <= 0:
              raise SystemExit('Economic validation FAILED: non-positive ROI')
          print('Economic safety gate passed; live stakes remain blocked when price evidence is insufficient.')
          PY
      - name: Verify V3 promotion gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/model/v3_models.json').read_text())
          if payload.get('production_approved') is not True:
              raise SystemExit('V3 promotion gate FAILED: challenger is not approved for production')
          print('V3 promotion gate PASSED')
          PY
      - name: Commit V3 model artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model/v3_models.json data/model/v3_backtest_report.json data/model/press_odds_benchmark_report.json data/rosters/historical_rosters.json
          if git diff --cached --quiet; then
            echo "No model artifact changes to commit"
            exit 0
          fi
          git commit -m "Update V3 evidence model artifact [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
