name: V3 evidence brain validation

on:
  push:
    branches: [main, v3-evidence-brain, v4-production-edge, v4-press-odds-benchmark, press-odds-benchmark-engine, press-odds-cleanup-v2, v5-market-opportunity-layer, experiment/full-starter-target-labels]
  workflow_dispatch:

# Generated model-artifact commits must not start another validation cycle.
# Otherwise the bot commit at the end of this workflow can retrigger itself indefinitely.

concurrency:
  group: v3-evidence-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      # Source-only checkout: the generated training dataset is rebuilt by this workflow.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            data/model
            data/matched
            data/processed/programs
            requirements.txt
            scripts
            src
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Build verified historical dataset
        run: python scripts/build_historical_dataset.py
      - name: Verify full-starter training cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path("data/dataset/training_dataset_audit.json").read_text(encoding="utf-8"))
          assert audit.get("cohort_schema_version") == 2, "Unexpected training-cohort schema."
          assert audit.get("training_rows", 0) > 0, "Training cohort is empty."
          assert audit.get("training_races", 0) >= 100, "Too few finalized races survived roster validation."
          print(json.dumps({key:audit.get(key) for key in (
              "cohort_schema_version", "eligible_finalized_races",
              "non_finalized_races", "finalized_races_without_valid_arrival",
              "incomplete_or_duplicate_rosters", "arrival_numbers_outside_roster",
              "candidate_rows_before_complete_roster_filter", "training_rows",
              "training_races", "placed_starter_rows", "unplaced_starter_rows",
              "explicit_win_odds_rows", "target_policy", "dead_heat_policy",
          )}, indent=2, ensure_ascii=False))
          PY
      - name: Run V3 tests
        run: python -m pytest -q
      - name: Run V3 walk-forward backtest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/dataset/training_dataset_clean.json").read_text())
          print(f"Dataset rows={len(d)} races={len({r.get('race_key') for r in d})}")
          PY
          python -m src.model.v3_backtest
      - name: Run historical press-odds benchmark
        run: python -m src.model.press_odds_benchmark
      - name: Train V3 model bundle
        run: python -m src.model.v3_train
      - name: Verify economic safety gate
        run: |
          python -m src.model.autopilot_guard
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/model/economic_validation_report.json').read_text())
          if p.get('status') == 'available' and float(p.get('roi', 0)) <= 0:
              raise SystemExit('Economic validation FAILED: non-positive ROI')
          print('Economic safety gate passed; live stakes remain blocked when price evidence is insufficient.')
          PY
      - name: Verify V3 promotion gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('data/model/v3_models.json').read_text())
          if payload.get('production_approved') is not True:
              raise SystemExit('V3 promotion gate FAILED: challenger is not approved for production')
          print('V3 promotion gate PASSED')
          PY
      - name: Commit V3 model artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model/v3_models.json data/model/v3_backtest_report.json data/model/press_odds_benchmark_report.json
          if git diff --cached --quiet; then
            echo "No model artifact changes to commit"
            exit 0
          fi
          git commit -m "Update V3 evidence model artifact [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
