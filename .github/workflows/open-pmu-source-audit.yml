name: Open PMU Source Audit

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Race date to inspect (MM/DD/YYYY)"
        required: true
        default: "09/29/2026"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit public Open PMU response (exploratory only)
        run: python scripts/audit_open_pmu_cotes.py --date "${{ inputs.date }}"
