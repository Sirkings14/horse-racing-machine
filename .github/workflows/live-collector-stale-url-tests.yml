name: Live collector stale URL tests

on:
  push:
    branches: [fix/skip-stale-live-program-pdfs]
    paths:
      - "src/live/collector.py"
      - "tests/test_live_pipeline.py"
      - ".github/workflows/live-collector-stale-url-tests.yml"
  pull_request:
    paths:
      - "src/live/collector.py"
      - "tests/test_live_pipeline.py"
      - ".github/workflows/live-collector-stale-url-tests.yml"

permissions:
  contents: read

concurrency:
  group: live-collector-stale-url-tests
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile collector and run focused tests
        run: |
          python -m py_compile src/live/collector.py tests/test_live_pipeline.py
          python -m pytest -q tests/test_live_pipeline.py
