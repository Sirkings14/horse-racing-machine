name: Partial-arrival label safety tests

on:
  push:
    branches: [fix/unknown-short-arrival-labels]
    paths:
      - "src/dataset/build_dataset.py"
      - "src/model/v3_model.py"
      - "src/model/v3_backtest.py"
      - "src/model/v3_train.py"
      - "tests/test_partial_arrival_labels.py"
      - ".github/workflows/partial-arrival-label-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partial-arrival-label-safety
  cancel-in-progress: true

jobs:
  partial-arrival-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout isolated label-safety branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
      - name: Compile touched modules
        run: python -m py_compile src/dataset/build_dataset.py src/model/v3_model.py src/model/v3_train.py src/model/v3_backtest.py tests/test_partial_arrival_labels.py
      - name: Run partial-arrival label regression tests
        run: python -m pytest -q tests/test_partial_arrival_labels.py
