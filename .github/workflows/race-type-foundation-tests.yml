name: Race type taxonomy and feature foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/model/race_type.py"
      - "src/model/v3_features.py"
      - "src/model/v3_train.py"
      - "src/model/race_strategy.py"
      - "src/model/form_analysis.py"
      - "src/notifications/telegram.py"
      - "src/parsers/program_parser.py"
      - "src/dataset/build_dataset.py"
      - "src/model/predict_v3.py"
      - "scripts/audit_race_type_coverage.py"
      - "tests/**"
      - ".github/workflows/race-type-foundation-tests.yml"
# A new branch commit supersedes the previous validation; do not queue stale test runs.
concurrency:
  group: race-type-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile source, scripts, and tests
        run: python -m compileall -q src scripts tests
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Audit race type and pre-race field coverage
        run: python scripts/audit_race_type_coverage.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: race-type-pre-race-field-coverage
          path: data/evaluation/race_type_coverage.json
          if-no-files-found: error
          retention-days: 30
