name: Program field audit
# Parser-mapping validation run (strict parser tests)

on:
  push:
    branches: [main, "feat/program-field-audit", "feat/structured-program-fields"]
    paths:
      - ".github/workflows/program_field_audit.yml"
      - "src/dataset/program_field_audit.py"
      - "data/processed/programs/**"
      - "data/structured/programs/**"
      - "tests/test_program_field_audit.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest
      - run: pytest -q tests/test_program_field_audit.py tests/test_program_table_fields.py
      - run: python -m src.parsers.program_parser
      - run: python -m src.dataset.program_field_audit > program_field_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: program-field-audit
          path: program_field_audit.json
