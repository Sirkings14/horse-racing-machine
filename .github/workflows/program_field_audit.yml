name: Program field audit

on:
  push:
    branches: [main, "feat/program-field-audit"]
    paths:
      - "src/dataset/program_field_audit.py"
      - "data/processed/programs/**"
      - "data/structured/programs/**"
      - "tests/test_program_field_audit.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install pytest
      - run: pytest -q tests/test_program_field_audit.py
      - run: python -m src.dataset.program_field_audit > program_field_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: program-field-audit
          path: program_field_audit.json
