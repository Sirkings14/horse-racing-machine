name: Run Race Machine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-machine:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Horse Racing Machine
        run: |
          python -m src.main

      - name: Save machine data
        run: |
          git config --global user.name "Horse Racing Machine"
          git config --global user.email "race-machine@github-actions"

          git add data/

          if git diff --cached --quiet; then
            echo "No new machine data to save."
          else
            git commit -m "Update race machine data"
            git push
          fi
