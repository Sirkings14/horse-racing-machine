name: Run Race Machine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-machine:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Horse Racing Machine
        run: |
          python -m src.main

      - name: Build Training Dataset
        run: |
          python -m src.dataset.build_dataset

      - name: Validate Training Dataset
        run: |
          python -m src.dataset.dataset_validator

      - name: Show Dataset Summary
        run: |
          echo "============================================"
          echo "TRAINING DATASET"
          echo "============================================"

          if [ -f data/dataset/training_dataset.json ]; then
            echo "Raw JSON dataset found:"
            ls -lh data/dataset/training_dataset.json
          else
            echo "ERROR: Raw JSON dataset was not created."
            exit 1
          fi

          if [ -f data/dataset/training_dataset.csv ]; then
            echo "Raw CSV dataset found:"
            ls -lh data/dataset/training_dataset.csv
          else
            echo "ERROR: Raw CSV dataset was not created."
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "CLEAN TRAINING DATASET"
          echo "============================================"

          if [ -f data/dataset/training_dataset_clean.json ]; then
            echo "Clean JSON dataset found:"
            ls -lh data/dataset/training_dataset_clean.json
          else
            echo "ERROR: Clean JSON dataset was not created."
            exit 1
          fi

          if [ -f data/dataset/dataset_review.json ]; then
            echo "Dataset review file found:"
            ls -lh data/dataset/dataset_review.json
          else
            echo "ERROR: Dataset review file was not created."
            exit 1
          fi

      - name: Save machine data
        run: |
          git config --global user.name "Horse Racing Machine"
          git config --global user.email "race-machine@github-actions"

          git add data/

          if git diff --cached --quiet; then
            echo "No new machine data to save."
          else
            git commit -m "Update race machine data and validated training dataset"
            git push
          fi
