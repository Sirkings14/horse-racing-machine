name: Autonomous Horse Racing Machine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "predict"
        type: choice
        options:
          - predict
          - results
          - full
  schedule:
    - cron: "0 7 * * *"
    - cron: "30 15 * * *"
    - cron: "15 20 * * *"

permissions:
  contents: write

jobs:
  machine:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "15 20 * * *" ]; then
              MODE="results"
            else
              MODE="predict"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run autonomous machine
        run: python -m src.main --mode "${{ steps.mode.outputs.mode }}"

      - name: Save machine data and outputs
        run: |
          git config --global user.name "Horse Racing Machine"
          git config --global user.email "race-machine@github-actions"
          git add data/
          if git diff --cached --quiet; then
            echo "No new machine data."
          else
            git commit -m "Update race machine data"
            git push
          fi
