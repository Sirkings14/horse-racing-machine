name: Run Race Machine

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-machine:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit == null || !contains(github.event.head_commit.message, 'Update race machine data') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Complete Horse Racing Machine
        run: python -m src.main

      - name: Show Dataset and Model Summary
        run: |
          echo "============================================"
          echo "TRAINING DATASET"
          echo "============================================"
          ls -lh data/dataset/training_dataset.json data/dataset/training_dataset.csv
          ls -lh data/dataset/training_dataset_clean.json data/dataset/dataset_review.json

          echo ""
          echo "============================================"
          echo "MODEL OUTPUTS"
          echo "============================================"
          ls -lh data/model/top3_model.json
          ls -lh data/model/backtest_report.json
          ls -lh data/model/latest_prediction.json

          echo ""
          echo "============================================"
          echo "BACKTEST REPORT"
          echo "============================================"
          cat data/model/backtest_report.json

          echo ""
          echo "============================================"
          echo "LATEST PREDICTION"
          echo "============================================"
          cat data/model/latest_prediction.json

          echo ""
          echo "Structured programs/results:"
          find data/structured/programs -name '*.json' | wc -l
          find data/structured/results -name '*.json' | wc -l

      - name: Save machine data and model outputs
        run: |
          git config --global user.name "Horse Racing Machine"
          git config --global user.email "race-machine@github-actions"

          git add data/

          if git diff --cached --quiet; then
            echo "No new machine data or model outputs to save."
          else
            git commit -m "Update race machine data and validated training dataset"
            git push
          fi
