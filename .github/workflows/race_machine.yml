name: Autonomous Horse Racing Machine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "predict"
        type: choice
        options:
          - predict
          - results
          - full
  schedule:
    - cron: "0 7 * * *"
    - cron: "30 15 * * *"
    - cron: "15 20 * * *"

permissions:
  contents: write

# The machine writes learned data back to main. Never allow two scheduled or
# manual runs to generate competing commits at the same time.
concurrency:
  group: horse-racing-machine-main-writer
  cancel-in-progress: false

jobs:
  machine:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "15 20 * * *" ]; then
              MODE="results"
            else
              MODE="predict"
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run autonomous machine
        run: python -m src.main --mode "${{ steps.mode.outputs.mode }}"

      - name: Save machine data and outputs safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Horse Racing Machine"
          git config user.email "race-machine@users.noreply.github.com"

          # The machine intentionally keeps its learned race data in Git.
          git add data/

          if git diff --cached --quiet; then
            echo "No new machine data."
            exit 0
          fi

          git commit -m "Update race machine data"

          # A human or another GitHub process may have updated main while this
          # run was computing. Rebase our data commit onto the current remote
          # tip, then push. Concurrency prevents competing machine writers.
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Machine data pushed successfully."
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict while saving machine data; refusing to overwrite main."
              exit 1
            fi

            echo "Push race on attempt $attempt; retrying with the latest main..."
            sleep $((attempt * 3))
          done

          echo "Could not safely push machine data after 3 attempts."
          exit 1
