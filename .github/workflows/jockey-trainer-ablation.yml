name: Jockey trainer chronological ablation
on:
  push:
    branches: [feature/walk-forward-jockey-trainer-profiles]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jockey-trainer-ablation
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Rebuild verified historical dataset
        run: python scripts/build_historical_dataset.py
      - name: Run regression suite
        run: python -m pytest -q
      - name: Compare baseline and challenger
        run: python -m scripts.compare_jockey_trainer_ablation
      - name: Upload chronological ablation report
        uses: actions/upload-artifact@v4
        with:
          name: jockey-trainer-ablation-report
          path: data/evaluation/jockey_trainer_ablation.json
          retention-days: 30
