name: Result arrival parser regression tests

on:
  push:
    branches: [fix/result-arrival-payout-leakage]
    paths:
      - "src/parsers/results_parser.py"
      - "scripts/audit_result_parser_corrections.py"
      - "scripts/preview_result_parser_migration.py"
      - "scripts/validate_result_parser_migration_manifest.py"
      - "tests/test_result_parser_truth.py"
      - "tests/test_result_parser_correction_audit.py"
      - "tests/test_result_parser_migration_preview.py"
      - ".github/workflows/result-arrival-parser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: result-arrival-parser-tests
  cancel-in-progress: true

jobs:
  result-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout isolated parser-fix branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile parser, audit, preflight utility, and tests
        run: python -m py_compile src/parsers/results_parser.py scripts/audit_result_parser_corrections.py scripts/preview_result_parser_migration.py scripts/validate_result_parser_migration_manifest.py tests/test_result_parser_truth.py tests/test_result_parser_correction_audit.py tests/test_result_parser_migration_preview.py tests/test_result_parser_migration_preflight.py
      - name: Run focused result-arrival regression tests
        run: |
          python -m unittest discover -s tests -p "test_result_parser_truth.py" -v
          python -m unittest discover -s tests -p "test_result_parser_correction_audit.py" -v
          python -m unittest discover -s tests -p "test_result_parser_migration_preview.py" -v
          python -m unittest discover -s tests -p "test_result_parser_migration_preflight.py" -v
      - name: Audit saved-result impact without modifying result files
        run: python scripts/audit_result_parser_corrections.py --output data/evaluation/result_parser_correction_audit.json
      - name: Preview roster-validated corrections without applying them
        run: python scripts/preview_result_parser_migration.py --output data/evaluation/result_parser_migration_preview.json
      - name: Preflight all candidate snapshots without applying
        run: python scripts/validate_result_parser_migration_manifest.py --manifest data/evaluation/result_parser_migration_preview.json --output data/evaluation/result_parser_migration_preflight.json
      - name: Upload read-only impact and migration-preview reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-parser-correction-impact
          path: |
            data/evaluation/result_parser_correction_audit.json
            data/evaluation/result_parser_migration_preview.json
            data/evaluation/result_parser_migration_preflight.json
          if-no-files-found: warn
          retention-days: 14
