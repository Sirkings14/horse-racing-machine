name: PMU official arrival shadow probe

on:
  push:
    branches: [feat/pmu-top5-shadow-after-parser-fix]
    paths:
      - "src/dataset/pmu_arrival_source.py"
      - "tests/test_pmu_arrival_source.py"
      - ".github/workflows/pmu-arrival-source-probe.yml"
  workflow_dispatch:
    inputs:
      race_date:
        description: "Race date (YYYY-MM-DD)"
        required: true
        default: "2026-10-10"
      track:
        description: "Racecourse"
        required: true
        default: "CAEN"
      meeting:
        description: "Meeting number"
        required: true
        default: "1"
      race_number:
        description: "Race number to probe"
        required: true
        default: "4"

permissions:
  contents: read

concurrency:
  group: pmu-top5-shadow-after-parser-fix
  cancel-in-progress: true

jobs:
  read-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest
      - name: Compile probe
        run: python -m py_compile src/dataset/pmu_arrival_source.py tests/test_pmu_arrival_source.py
      - name: Run isolated offline tests
        run: python -m pytest -q tests/test_pmu_arrival_source.py
      - name: Probe one known race; never change training or production artifacts
        continue-on-error: true
        env:
          RACE_DATE: ${{ github.event.inputs.race_date || '2026-10-10' }}
          TRACK: ${{ github.event.inputs.track || 'CAEN' }}
          MEETING: ${{ github.event.inputs.meeting || '1' }}
          RACE_NUMBER: ${{ github.event.inputs.race_number || '4' }}
        run: |
          python -m src.dataset.pmu_arrival_source --date "$RACE_DATE" --track "$TRACK" --meeting "$MEETING" --race "$RACE_NUMBER" --report data/evaluation/pmu_arrival_source_probe_primary.json
      - name: Probe independent historical Vincennes race
        continue-on-error: true
        run: |
          python -m src.dataset.pmu_arrival_source --date 2026-10-09 --track "PARIS-VINCENNES NOCTURNE" --meeting 1 --race 4 --report data/evaluation/pmu_arrival_source_probe_vincennes.json
      - name: Probe independent historical Vincennes meeting result
        continue-on-error: true
        run: |
          python -m src.dataset.pmu_arrival_source --date 2026-09-05 --track "PARIS-VINCENNES" --meeting 1 --race 4 --report data/evaluation/pmu_arrival_source_probe_vincennes_sep05.json
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmu-arrival-shadow-report
          path: data/evaluation/pmu_arrival_source_probe_*.json
          if-no-files-found: warn
          retention-days: 14
