name: Market Odds Evidence CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/model/market_evidence.py"
      - "src/model/market_odds_capture.py"
      - "src/model/live_pmu_odds_capture.py"
      - "src/model/turf_bzh_odds.py"
      - "src/model/profitability.py"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/odds-evidence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q src scripts
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
