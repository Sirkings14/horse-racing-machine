name: Model V2 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v2-model-calibration
    paths:
      - "src/model/**"
      - "tests/**"
      - "data/model/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q src
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Walk-forward model backtest
        run: python -m src.model.backtest
      - name: Walk-forward order backtest
        run: python -m src.model.order_backtest
      - name: Verify baseline report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/model/backtest_report.json").read_text())
          assert report["evaluated_races"] > 0
          assert "baselines" in report
          order = json.loads(Path("data/model/order_backtest_report.json").read_text())
          assert "pairwise_random_accuracy" in order["baseline"]
          if order.get("status") == "insufficient_data":
              print("Order backtest not scored: insufficient verified races; this is informational, not a model pass.")
          else:
              assert order["evaluated_races"] > 0
          print("Walk-forward reports validated")
          PY
      - name: Validate probability correction
        run: |
          python - <<'PY'
          from src.model.feature_engineering import FEATURE_NAMES
          from src.model.logistic_model import LogisticModel

          dimension = len(FEATURE_NAMES)
          m = LogisticModel(
              feature_names=[],
              mean=[0.0] * dimension,
              std=[1.0] * dimension,
              intercept=0.0,
              coefficients=[0.0] * dimension,
              positive_weight=2.0,
          )
          raw = m.predict_weighted_proba([{}])[0]
          corrected = m.predict_proba([{}])[0]
          assert abs(raw - 0.5) < 1e-9
          assert abs(corrected - (1 / 3)) < 1e-9
          print(f"Probability prior correction passed for {dimension} features")
          PY